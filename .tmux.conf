# ─────────────────────────────────────────────────────────────
#  .tmux.conf — Michka
#  Portage de Hyprland-Michka vers tmux, en SSH depuis Windows
#
#  Modèle mental :
#    session = la machine (le bureau)
#    window  = un workspace Hyprland   -> Alt + touche du chiffre
#    pane    = une fenêtre Hyprland    -> Alt + flèches (ou hjkl)
#
#  $mainMod = Alt, parce que SUPER est capté par Windows et n'arrive
#  jamais jusqu'au terminal. Les flèches fonctionnent une fois les
#  raccourcis Alt+flèches et Alt+Shift+flèches désactivés dans les
#  réglages de Windows Terminal, qui les consommaient avant qu'elles
#  partent dans le SSH. hjkl est gardé en parallèle, comme repli.
#
#  Les workspaces sont sur les touches nues de la rangée des chiffres
#  en AZERTY (& é " ' ( - è _ ç à), Shift pour y déplacer un pane :
#  la même logique que Super et Super+Shift dans Hyprland.
#
#  Palette : black #000000 / white #ffffff / red #ff0000 / grey #5c5c5c
# ─────────────────────────────────────────────────────────────

# ── Base ─────────────────────────────────────────────────────
set -g prefix C-Space                  # préfixe (au lieu de Ctrl+b)
unbind C-b
bind C-Space send-prefix

set -g default-terminal "tmux-256color"
set -sa terminal-overrides ",xterm*:RGB"   # vraies couleurs 24 bits
set -sg escape-time 10                 # distingue Alt d'un ESC isolé
set -g focus-events on
set -g history-limit 50000
set -g base-index 1                    # numérotation à partir de 1
setw -g pane-base-index 1
set -g renumber-windows off            # les numéros de workspace restent fixes
set -g mouse on
setw -g mode-keys vi
set -g set-clipboard on                # copie vers Windows via OSC 52

setw -g automatic-rename on
setw -g automatic-rename-format "#{pane_current_command}"

# ─────────────────────────────────────────────────────────────
#  PANES  (= fenêtres Hyprland)
# ─────────────────────────────────────────────────────────────

# movefocus — Super+flèches
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# movewindow — Super+Shift+flèches. Marque, échange, et le -d de
# swap-pane garde le focus sur le pane déplacé.
bind -n M-S-Left  select-pane -m \; select-pane -L \; swap-pane -d \; select-pane -M
bind -n M-S-Right select-pane -m \; select-pane -R \; swap-pane -d \; select-pane -M
bind -n M-S-Up    select-pane -m \; select-pane -U \; swap-pane -d \; select-pane -M
bind -n M-S-Down  select-pane -m \; select-pane -D \; swap-pane -d \; select-pane -M
bind -n M-H select-pane -m \; select-pane -L \; swap-pane -d \; select-pane -M
bind -n M-J select-pane -m \; select-pane -D \; swap-pane -d \; select-pane -M
bind -n M-K select-pane -m \; select-pane -U \; swap-pane -d \; select-pane -M
bind -n M-L select-pane -m \; select-pane -R \; swap-pane -d \; select-pane -M

# resizeactive — Super+Ctrl+flèches, et préfixe puis hjkl en repli
# (répétable tant qu'on reste dans la fenêtre de répétition).
# Jamais sur Ctrl+Alt+hjkl : Ctrl+h vaut Backspace et Ctrl+j vaut
# Entrée, tmux ne peut pas les distinguer.
bind -n C-M-Left  resize-pane -L 5
bind -n C-M-Right resize-pane -R 5
bind -n C-M-Up    resize-pane -U 3
bind -n C-M-Down  resize-pane -D 3
bind -r h resize-pane -L 5
bind -r j resize-pane -D 3
bind -r k resize-pane -U 3
bind -r l resize-pane -R 5

# nouveau terminal — Super+Q. Coupe le pane actif, pas le workspace.
# La direction suit dwindle : on coupe le plus grand côté. Le facteur
# 3 et non 2 parce qu'une cellule fait environ le double en hauteur
# qu'en largeur — sur 261x60 c'est ce qui donne l'alternance stricte
# colonne / empilé. Le nouveau pane hérite du répertoire courant.
bind -n M-q run-shell 'W="#{pane_width}"; H="#{pane_height}"; \
  if [ "$W" -gt "$(( H * 3 ))" ]; then \
        tmux split-window -h -t "#{pane_id}" -c "#{pane_current_path}"; \
          else \
                tmux split-window -v -t "#{pane_id}" -c "#{pane_current_path}"; \
                  fi'

# splits explicites, quand la direction de dwindle ne convient pas
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# killactive — Super+C. Refuse de fermer le dernier pane : sans ce
# garde-fou, tmux tue la session et renvoie dans bash, où les binds
# Alt ne répondent évidemment plus.
bind -n M-c run-shell 'if [ "#{session_windows}" = 1 ] && [ "#{window_panes}" = 1 ]; then \
  tmux display-message "dernier pane — Alt+Shift+M pour quitter"; else \
    tmux kill-pane -t "#{pane_id}"; fi'

# fullscreen — Super+F
bind -n M-f resize-pane -Z

# ─────────────────────────────────────────────────────────────
#  WORKSPACES  (= windows tmux)
# ─────────────────────────────────────────────────────────────

# Touche nue du chiffre : aller au workspace, le créer s'il n'existe
# pas encore — comme Hyprland, sans avoir à les ouvrir dans l'ordre.
bind -n 'M-&' run-shell 'tmux select-window -t :1 2>/dev/null || tmux new-window -t :1'
bind -n 'M-é' run-shell 'tmux select-window -t :2 2>/dev/null || tmux new-window -t :2'
bind -n 'M-"' run-shell 'tmux select-window -t :3 2>/dev/null || tmux new-window -t :3'
bind -n "M-'" run-shell 'tmux select-window -t :4 2>/dev/null || tmux new-window -t :4'
bind -n 'M-(' run-shell 'tmux select-window -t :5 2>/dev/null || tmux new-window -t :5'
bind -n 'M--' run-shell 'tmux select-window -t :6 2>/dev/null || tmux new-window -t :6'
bind -n 'M-è' run-shell 'tmux select-window -t :7 2>/dev/null || tmux new-window -t :7'
bind -n 'M-_' run-shell 'tmux select-window -t :8 2>/dev/null || tmux new-window -t :8'
bind -n 'M-ç' run-shell 'tmux select-window -t :9 2>/dev/null || tmux new-window -t :9'
bind -n 'M-à' run-shell 'tmux select-window -t :10 2>/dev/null || tmux new-window -t :10'

# Shift : y déplacer le pane courant. Alt+Shift+touche2 produit
# exactement M-2 en AZERTY, les deux couches ne se croisent donc pas.
# Le script applique la règle de split d'Alt+Q, mesurée sur le pane
# qui accueille, et crée le workspace s'il n'existe pas.
bind -n M-1 run-shell '~/.config/tmux/move-pane.sh "#{session_name}" 1 "#{pane_id}"'
bind -n M-2 run-shell '~/.config/tmux/move-pane.sh "#{session_name}" 2 "#{pane_id}"'
bind -n M-3 run-shell '~/.config/tmux/move-pane.sh "#{session_name}" 3 "#{pane_id}"'
bind -n M-4 run-shell '~/.config/tmux/move-pane.sh "#{session_name}" 4 "#{pane_id}"'
bind -n M-5 run-shell '~/.config/tmux/move-pane.sh "#{session_name}" 5 "#{pane_id}"'
bind -n M-6 run-shell '~/.config/tmux/move-pane.sh "#{session_name}" 6 "#{pane_id}"'
bind -n M-7 run-shell '~/.config/tmux/move-pane.sh "#{session_name}" 7 "#{pane_id}"'
bind -n M-8 run-shell '~/.config/tmux/move-pane.sh "#{session_name}" 8 "#{pane_id}"'
bind -n M-9 run-shell '~/.config/tmux/move-pane.sh "#{session_name}" 9 "#{pane_id}"'
bind -n M-0 run-shell '~/.config/tmux/move-pane.sh "#{session_name}" 10 "#{pane_id}"'

bind -n M-t new-window -c "#{pane_current_path}"   # nouveau workspace
bind Tab last-window                               # dernier workspace

# molette sur la barre — mouse_up / mouse_down
bind -n WheelUpStatus   previous-window
bind -n WheelDownStatus next-window

# ─────────────────────────────────────────────────────────────
#  DIVERS
# ─────────────────────────────────────────────────────────────

# wofi drun — Super+D. Le programme est la fenêtre : quand il se
# termine, le workspace disparaît. Shell non interactif, donc les
# alias et fonctions du .bashrc ne sont pas disponibles.
bind -n M-d command-prompt -p "run:" "new-window '%%'"

# mode copie — plus commode que le préfixe puis [, qui demande
# AltGr+5 en AZERTY. La molette vers le haut y entre aussi.
bind -n M-s copy-mode

# rechargement — Super+R. source-file ajoute mais n'annule rien :
# un bind supprimé du fichier reste actif jusqu'à un unbind ou un
# tmux kill-server.
bind -n M-r source-file ~/.tmux.conf \; display-message "tmux.conf rechargé"

# exit — Super+Shift+M
bind -n M-M confirm-before -p "tuer la session ? (y/n)" kill-session

# ─────────────────────────────────────────────────────────────
#  STYLE — transposition de waybar : noir, blanc gras, accent rouge
# ─────────────────────────────────────────────────────────────
set -g status-position top
set -g status-interval 15
set -g status-justify left
set -g status-style "bg=#000000,fg=#ffffff,bold"
set -g status-left-length 40
set -g status-right-length 80

# border_size = 1 : actif rouge, inactif #444444
set -g pane-border-style "fg=#444444"
set -g pane-active-border-style "fg=#ff0000"
set -g display-panes-colour "#444444"
set -g display-panes-active-colour "#ff0000"

# messages et sélection : noir sur rouge, comme error_symbol de starship
set -g message-style "bg=#ff0000,fg=#000000,bold"
set -g message-command-style "bg=#ff0000,fg=#000000,bold"
setw -g mode-style "bg=#ff0000,fg=#000000,bold"

setw -g clock-mode-colour "#ff0000"
setw -g clock-mode-style 24

set -g status-left "#[fg=#ff0000,bold]  #[fg=#ffffff,bold]#S #[fg=#444444]│ "

# le ▍ rouge transpose le border-top: 2px solid @red de waybar
setw -g window-status-format "#[fg=#5c5c5c] #I #W "
setw -g window-status-current-format "#[fg=#ff0000,bold]▍#[fg=#ffffff,bold]#I #W#{?window_zoomed_flag, [Z],} "
setw -g window-status-separator ""
setw -g window-status-activity-style "fg=#ff0000,bold"

set -g status-right "#[fg=#5c5c5c]#{pane_current_command} #[fg=#444444]│ #[fg=#ffffff,bold]󰈀  #h #[fg=#444444]│ #[fg=#ffffff,bold]  %a %d %H:%M "

# ── Mode copie (vi) ─────────────────────────────────────────
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# ─────────────────────────────────────────────────────────────
#  NOTES
#
#  1. Dépendance : ~/.config/tmux/move-pane.sh, appelé par les binds
#     Alt+chiffre. Sans lui, déplacer un pane ne fait plus rien.
#
#  2. Raccourcis readline de bash masqués par les binds Alt :
#       Alt+c capitalize-word · Alt+d kill-word · Alt+f forward-word
#       Alt+l downcase-word   · Alt+r revert-line · Alt+t transpose-words
#     Alt+b et Alt+Backspace restent intacts. Pour en récupérer un,
#     commente la ligne et déplace l'action sur le préfixe.
#
#  3. Préfixe + l ne fait plus last-window (c'est un resize) :
#     c'est préfixe + Tab.
#
#  4. Les icônes  󰈀 ▍ demandent une Nerd Font côté Windows
#     (CaskaydiaCove ou MesloLGS NF), sinon carrés.
#
#  5. Si "tmux-256color" est absent côté serveur :
#       set -g default-terminal "xterm-256color"
#
#  6. Cette config vise tmux 3.0+. display-popup, pane-border-lines
#     et allow-passthrough demandent 3.2 ou 3.3 et sont écartés.
# ─────────────────────────────────────────────────────────────
